[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furlong"
version = "0.1.0"
description = "Irish-first UK+IRE horse-racing value engine: daily bet suggestions from a predictive model blended with market odds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "fastapi>=0.100",
    "jinja2>=3.1",
    "uvicorn>=0.23",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
furlong = "furlong.cli:main"

[tool.setuptools.packages.find]
include = ["furlong*"]

[tool.setuptools.package-data]
"furlong.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
